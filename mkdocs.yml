          - Environment variables: getting-started/configuration/environment-variables.md
          - Profiles: getting-started/configuration/profiles.md
      - First order: getting-started/first-order.md

  - Guides:
      - guides/index.md
      - Authentication:
          - guides/authentication/index.md
          - OAuth2 client credentials: guides/authentication/oauth2.md
          - API keys: guides/authentication/api-keys.md
          - Roles and permissions: guides/authentication/roles-and-permissions.md
      - Events:
          - guides/events/index.md
          - Queues and topics: guides/events/queues.md
          - Retries and idempotency: guides/events/retries.md
      - Migrations:
          - guides/migrations/index.md
          - From 3.8 LTS to 4.2 LTS: guides/migrations/from-3-8-to-4-2.md
      - Multi-tenancy: guides/multi-tenancy.md

  - API:
      - api/index.md
      - REST:
          - api/rest/index.md
          - Resources:
              - Customers: api/rest/resources/customers.md
              - Orders: api/rest/resources/orders.md
              - Payments: api/rest/resources/payments.md
          - Pagination and filtering: api/rest/pagination.md
          - Rate limits: api/rest/rate-limits.md
          - Error codes: api/rest/error-codes.md
      - Webhooks:
          - api/webhooks/index.md
          - Event types: api/webhooks/event-types.md
          - Signature verification: api/webhooks/signature-verification.md
      - Client libraries:
          - api/sdk/index.md
          - Java: api/sdk/java.md
          - Python: api/sdk/python.md

  - Operations:
      - operations/index.md
      - Monitoring:
          - operations/monitoring/index.md
          - Metrics: operations/monitoring/metrics.md
          - Logs: operations/monitoring/logs.md
          - Alerts: operations/monitoring/alerts.md
      - Backups: operations/backups.md
      - Scaling and performance: operations/scaling.md
      - Security: operations/security.md
      - Runbooks:
          - operations/runbooks/index.md
          - PostgreSQL outage: operations/runbooks/database-outage.md
          - Event queue backlog: operations/runbooks/queue-backlog.md

  - Help:
      - FAQ: faq.md
      - Changelog: changelog.md
      - Support: support.md
